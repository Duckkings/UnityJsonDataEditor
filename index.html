<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据表编辑器</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="dark">
    <div id="app">
      <!-- 文件工具栏 -->
      <header class="toolbar">
        <button id="chooseDir">选择工作目录</button>
        <span id="currentDir" class="dir-label"></span>
        <button id="saveBtn">保存</button>
        <button id="regenerateCs">重新生成C#数据结构脚本</button>
        <button id="toggleDark">夜间模式</button>
        <button id="helpBtn">操作指南</button>
        <input id="paramWidth" type="range" min="1" max="3" step="0.1" value="1" title="调整参数栏比例" />
        <span id="paramWidthLabel" style="font-size:12px;">参数栏比例</span>
        <!-- 行高调整 -->
        <input id="rowHeight" type="range" min="0.1" max="2" step="0.1" value="1" title="调整行高比例" />
        <span id="rowHeightLabel" style="font-size:12px;">行高比例</span>
        <div id="message" class="message" style="display:none"></div>
      </header>
      <!-- 主内容区域：三列布局 -->
      <main class="container">
        <!-- 模板列表 -->
        <section class="panel templates">
          <div class="panel-header">
            <input id="templateName" type="text" placeholder="模板名" />
            <button id="newTemplate" class="primary">新建模板</button>
            <button id="renameTemplate" title="重命名选中模板">重命名</button>
          </div>
          <div class="search-bar"><input id="searchTemplates" type="text" placeholder="搜索模板" /></div>
          <ul id="templateList" class="list"></ul>
        </section>
        <!-- 数据实例 -->
        <section class="panel instances">
          <div class="panel-header">
            <input id="instanceName" type="text" placeholder="实例名" />
            <button id="newInstance" class="primary">新建实例</button>
            <button id="renameInstance" title="重命名选中实例">重命名</button>
            <div class="actions">
              <button id="copyInstance">复制</button>
              <button id="pasteInstance">粘贴</button>
              <button id="deleteInstance">删除</button>
            </div>
          </div>
          <div class="search-bar"><input id="searchInstances" type="text" placeholder="搜索实例" /></div>
          <ul id="instanceList" class="list"></ul>
        </section>
        <!-- 参数编辑 -->
        <section class="panel parameters">
          <div class="panel-header">
            <input id="paramName" type="text" placeholder="参数名" />
            <select id="paramType">
              <option value="string">字符串</option>
              <option value="int">整数</option>
              <option value="float">浮点数</option>
              <option value="long">长整型</option>
              <option value="bool">布尔</option>
              <option value="list">列表</option>
              <option value="object">对象</option>
            </select>
            <button id="newParam" class="primary">新建参数</button>
            <div class="index-selectors">
              <select id="indexTemplate"></select>
              <select id="indexParam"></select>
            </div>
          </div>
          <div class="search-bar"><input id="searchParams" type="text" placeholder="搜索参数" /></div>
          <div id="paramList" class="param-list"></div>
        </section>
      </main>
    </div>
  </body>
  </html>
